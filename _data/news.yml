# News & wins: newest first. Add a new entry at the top for every win.
#   date: YYYY-MM-DD   (used for ordering and shown as "Mon YYYY")
#   when: optional text shown instead of the date, e.g. "2024" if the month is unknown
#   text: one or two sentences (Markdown links allowed)
- date: 2026-07-15
  when: "Summer 2026"
  text: "Spent four months as a Staff Geologist (summer internship) at Lettis Consultants International."
- date: 2026-07-01
  when: "Jul 2026"
  text: "Wrote *Do We Really Know Auckland's Earthquake Risk? A Case Study on the Mangatangi Fault* for *Geoscientist Aotearoa*. [Read the article](/outreach/ga-2026-mangatangi-article/)."
- date: 2026-05-27
  text: "My Mangatangi Fault research was covered by The Guardian, Nautilus, RNZ and the University of Auckland. [See the press coverage](/outreach/#press)."
- date: 2026-05-26
  text: "Published my lead-author paper *Low Hazard–High Risk: A Case Study of the Active Mangatangi Fault*, in the New Zealand Journal of Geology and Geophysics. [Read the paper](https://doi.org/10.1002/jgo2.70060)."
- date: 2026-04-01
  when: "2026"
  text: "Awarded a Geological Society of America Graduate Student Research Grant for my project *I'm a Creep, I'm a Microstructure: The textural signature of creep in the Central Calaveras Fault*."
- date: 2026-03-05
  when: "Mar 2026"
  text: "Gave a lightning talk on my paleoseismic study of the creeping Calaveras Fault at Coyote Ranch at the 2026 SCEC Fault Creep Workshop in San Jose. [See the talk](/talks/2026-scec-fault-creep-workshop)."
- date: 2025-09-08
  when: "Sep 2025"
  text: "Presented my poster *Geomorphic characterization of fault creep in the San Francisco Bay Area, California* at the 2025 SCEC Annual Meeting. [See the poster](/talks/2025-scec-fault-creep)."
- date: 2025-04-25
  when: "Apr 2025"
  text: "Won the **Eye Catching Science Award** at the first annual Nevada Geoscience Research Symposium in Reno. [See the poster](/talks/2025-nevada-geoscience-symposium)."
- date: 2025-04-15
  when: "Apr 2025"
  text: "Presented my fault creep poster at the 2025 Seismological Society of America Annual Meeting in Baltimore. [See the poster](/talks/2025-ssa-fault-creep)."
- date: 2024-12-09
  text: "Joined the Nevada Seismological Laboratory field response to the M5.7 Parker Butte earthquake, deploying temporary seismic stations to record aftershocks."
- date: 2024-06-01
  when: "2024"
  text: "Graduated with First Class Honours in my M.Sc. in Earth Science at the University of Auckland."
- date: 2024-03-01
  when: "Early 2024"
  text: "Joined the Geoscience Society of New Zealand Executive Committee as Co-Editor of *Geoscientist Aotearoa* magazine."
- date: 2024-02-01
  when: "2024"
  text: "Presented my Mangatangi Fault research to the Auckland Geology Club. [All talks](/talks/)."
- date: 2023-11-01
  when: "2023"
  text: "Presented *Characterisation of post-Pliocene dynamics of the Mangatangi Fault* at the Geoscience Society of New Zealand Annual Conference in Wellington."
